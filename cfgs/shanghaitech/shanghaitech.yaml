#############################
### Shanghaitech  Dataset ###
############################

GPUS: (0,1,2,3)
PRINT_FREQ: 100

DATA:
  BATCH_SIZE: 128
  IMG_SIZE: [32, 32]
  DATASET: 'shanghaitech'
  NUM_WORKERS: 6

MODEL:
  NAME: CrossAnomaly
  PRETRAINED: '../../datasets/seg_weights/pvt_v2_b2.pth'
  CONCATENATED_LAYERS: [0,1,2,3]

UNET:
  IN_CHANNELS: 2
  OUT_CHANNELS: 2
  CHANNELS: 64
  PRE_TRAINED: ''
  ATTN_RESOLUTION: [8, 16]

TRAIN:
  EPOCHS: 120
  WARMUP_EPOCHS: 6
  BASE_LR: 5e-4           # default 5e-4=0.000 5
  WARMUP_LR: 5e-7         # default 5e-7=0.000 0005
  MIN_LR: 5e-6            # default 5e-6=0.000 005

TEST:
  FLOW_WEIGHT: 0.1
  FRAME_WEIGHT: 1.0

